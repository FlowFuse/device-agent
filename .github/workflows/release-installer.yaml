name: Installer Release

on:
  push:
    tags:
      - "installer-v*.*.*"

env:
  GO_VERSION: '1.24.2'

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./installer/go

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: linux
            goarch: arm
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: "**/go.sum"

    - name: Download dependencies
      run: go mod download

    - name: Build binary for ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
        TAG_NAME: ${{ github.ref_name }}
      run: |
        VERSION="${TAG_NAME#installer-v}"
        ARTIFACT="flowfuse-device-installer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
        echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"
        echo "Building ${ARTIFACT}"

        mkdir -p artifacts
        go build -ldflags "-X main.instVersion=${VERSION} -s -w" -o "artifacts/${ARTIFACT}" main.go

        ls -la "artifacts/${ARTIFACT}"

        # Smoke-test the version output on the native build only
        if [ "${{ matrix.goos }}-${{ matrix.goarch }}" = "linux-amd64" ]; then
          "./artifacts/${ARTIFACT}" --version
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARTIFACT }}
        path: installer/go/artifacts/${{ env.ARTIFACT }}
        retention-days: 1

  publish-artifacts:
    name: Add Binaries to Release
    runs-on: ubuntu-latest
    needs: [build-artifacts]

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        pattern: flowfuse-device-installer-*
        merge-multiple: true

    - name: Add artifacts as release assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        ls -la artifacts/
        gh release upload "$TAG_NAME" artifacts/* --clobber --repo "${{ github.repository }}"

    # release-please hardcodes the release name as "<component>: v<version>" and there is no possibility to override it;
    # rename it to match the titles used before the release-please adoption
    - name: Set release title
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        VERSION="${TAG_NAME#installer-v}"
        gh release edit "$TAG_NAME" --title "Installer v${VERSION}" \
          --repo "${{ github.repository }}"


  publish-installer-scripts:
    name: Publish Installer Scripts to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      
    - name: Prepare installer scripts for GitHub Pages
      run: |
        echo "Preparing installer scripts for deployment..."
        mkdir -p _site
        cp installer/get.ps1 _site/
        cp installer/get.sh _site/
        echo "Files in _site directory:"
        ls -la _site/
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

    - name: Publish to GitHub Pages
      id: publish
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      
    - name: Output deployment URL
      run: |
        echo "🚀 Installer scripts have been published to GitHub Pages!"
        echo "📍 URL: ${{ steps.publish.outputs.page_url }}"
        echo ""
        echo "📥 Direct download links:"
        echo "   Linux/macOS: ${{ steps.publish.outputs.page_url }}get.sh"
        echo "   Windows:     ${{ steps.publish.outputs.page_url }}get.ps1"

  notify-slack:
    name: Notify about release failure
    needs: [build-artifacts, publish-artifacts, publish-installer-scripts]
    if: failure()
    runs-on: ubuntu-latest

    steps:
    - name: Notify Slack
      uses: FlowFuse/github-actions-workflows/actions/slack_notification@slack_notification/v1
      with:
        bot-token: ${{ secrets.SLACK_GHBOT_TOKEN }}
        mode: channel
        blocks: |
          [
            { "type": "header", "text": { "type": "plain_text", "text": ":x: ${{ github.workflow }} workflow within ${{ github.repository }} failed", "emoji": true } },
            { "type": "divider" },
            { "type": "section", "text": { "type": "mrkdwn", "text": "<${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-installer.yaml|${{ github.workflow }}> workflow failed to complete successfully." } },
            { "type": "section", "text": { "type": "mrkdwn", "text": "*Workflow run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>" } }
          ]
