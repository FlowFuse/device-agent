name: Docker build

on:
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yaml'

jobs:
  docker-build:
    name: 'Build docker image: Node ${{ matrix.node }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - node: 18
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - node: 20
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - node: 22
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - node: 24
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 #v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platforms }}
          tags: flowfuse-device-agent-pr:${{ matrix.node }}-scan
          push: false
          load: true
          build-args: |
            NODE_VERSION=${{ matrix.node }}

      - name: Perform SAST scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flowfuse-device-agent-pr:${{ matrix.node }}-scan
          trivy-config: .github/trivy.yaml
          output: 'sast-results.sarif'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: sast-results.sarif
